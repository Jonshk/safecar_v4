name: safecar_app
description: Safe Car Automotive — Chicago's Premier Auto Parts & Training Center
publish_to: 'none'
version: 2.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  provider: ^6.1.2
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  badges: ^3.1.2
  lottie: ^3.1.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  flutter_stripe: ^11.1.0
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/splash_safe_car.png
    - assets/images/icon.png
